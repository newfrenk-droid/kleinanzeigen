{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0">Лог</h2>
    <a class="btn" href="">Обновить</a>
  </div>
  <table style="margin-top:12px">
    <tr><th>Время</th><th>Аккаунт</th><th>Сообщение</th></tr>
    {% for l in items %}
    <tr class="lvl-{{ l.level }}">
      <td class="muted" style="white-space:nowrap">{{ l.ts|dt }}</td>
      <td>{{ l.account_name or '' }}</td>
      <td><pre>{{ l.message }}</pre></td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="muted">Записей нет.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
