<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}KA Автоответчик{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --card:#1d2027; --fg:#e7e9ee; --muted:#9aa1ad; --line:#2d313a; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  nav { display:flex; gap:4px; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  nav a { padding:6px 12px; border-radius:6px; color:var(--fg); text-decoration:none; }
  nav a:hover, nav a.active { background:var(--bg); }
  nav b { margin-right:12px; padding:6px 0; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
  input[type=text], input[type=number], input[type=password], textarea, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:120px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
  label { display:block; margin:12px 0 4px; font-weight:500; }
  .hint { color:var(--muted); font-size:12px; margin-top:2px; }
  .btn, button { display:inline-block; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; text-decoration:none; font:inherit; }
  .btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  form.inline { display:inline; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:0 16px; }
  .st-running { color:var(--ok); } .st-error, .st-cookies_invalid { color:var(--bad); } .st-starting { color:var(--warn); }
  .muted { color:var(--muted); }
  .error { background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); padding:10px; border-radius:6px; }
  .ok { background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok); padding:10px; border-radius:6px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  .lvl-error { color:var(--bad); } .lvl-warning { color:var(--warn); }
  pre { white-space:pre-wrap; margin:0; font:inherit; }
</style>
</head>
<body>
<nav>
  <b>KA Автоответчик</b>
  <a href="/">Аккаунты</a>
  <a href="/templates">Шаблоны ответов</a>
  <a href="/dialogs">Диалоги</a>
  <a href="/logs">Лог</a>
  <a href="/settings">Настройки</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
